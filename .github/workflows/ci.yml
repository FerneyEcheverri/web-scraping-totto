name: CI/CD - Web Scraping Totto

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pruebas:
    name: Integracion continua - CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar Python
        run: python --version

      - name: Ejecutar pruebas automatizadas
        run: python -m unittest discover -s tests -v

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos de la pagina web
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/

  entrega:
    name: Entrega de artefacto academico
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar artefacto del proyecto
        run: |
          mkdir -p entrega
          cp notebooks/EA1_Proyecto_Totto.ipynb entrega/
          cp docs/bitacora.md entrega/

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: proyecto-web-scraping-totto
          path: entrega/
          retention-days: 30

  despliegue:
    name: Despliegue de aplicacion web - CD
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}

    steps:
      - name: Publicar aplicacion en GitHub Pages
        id: publicacion
        uses: actions/deploy-pages@v4
